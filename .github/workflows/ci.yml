# Lint and unit tests. No GPU, no AWS, no model weights.
#
# This runs the whole suite because the suite is deliberately runnable without any of
# those: the Triton backend is exercised against a stubbed `triton_python_backend_utils`,
# and the cross-request cache gather is plain tensor indexing on CPU. What CI cannot cover
# is numerical equivalence against the real 2B torso and the container actually starting --
# those are `tools/batch_parity.py` and `tools/triton_smoke.sh`, run on a GPU host. See
# README.md, "Verification and measurement".

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned: a ruff minor bump can add rules and turn a green main red without
          # anything in this repository changing.
          version: 0.16.10

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject sets requires-python = ">=3.10". Both ends are tested so the floor is
        # a claim rather than an aspiration.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        # The CPU torch wheel, explicitly. The default index pulls the CUDA build, which is
        # ~2.5 GB of nvidia-* wheels that this suite never touches.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
                               --extra-index-url https://pypi.org/simple \
                               -r requirements-dev.txt

      - name: Show what we are testing against
        run: |
          python -c "import sys, torch, transformers, pydantic; \
            print('python', sys.version.split()[0]); \
            print('torch', torch.__version__); \
            print('transformers', transformers.__version__); \
            print('pydantic', pydantic.__version__)"

      - name: Tests
        run: python -m pytest -q

      - name: Notebook is valid and carries no saved output
        # Saved outputs would mean committed response data and noisy diffs; an unparseable
        # cell would mean the playground is broken for whoever clones this.
        run: |
          python - <<'PY'
          import ast
          import json
          import pathlib

          failures = []
          for path in pathlib.Path("notebooks").glob("*.ipynb"):
              nb = json.loads(path.read_text())
              code = [c for c in nb["cells"] if c["cell_type"] == "code"]
              for cell in code:
                  try:
                      ast.parse("".join(cell["source"]))
                  except SyntaxError as exc:
                      failures.append(f"{path}:{cell.get('id')}: {exc}")
              if any(c.get("outputs") for c in nb["cells"]):
                  failures.append(f"{path}: has saved outputs; clear them before committing")
              if any(c.get("execution_count") is not None for c in nb["cells"]):
                  failures.append(f"{path}: has execution counts; clear them before committing")
              print(f"{path}: {len(nb['cells'])} cells ({len(code)} code) ok")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Shell scripts parse
        run: |
          for f in deploy/build_on_box.sh tools/triton_smoke.sh; do
            bash -n "$f" && echo "ok $f"
          done

      - name: No credentials or account identifiers committed
        # Cheap backstop, not a substitute for secret scanning. Two literals are allowed,
        # both of which are public by construction rather than "probably fine":
        #   763104351884 is AWS's own public Deep Learning Container registry, and the
        #                image URI has to be literal for the build to work.
        #   111122223333 is the account id AWS reserves for its own documentation examples.
        #                tests/test_deploy.py uses it to assert that the execution role's
        #                trust policy pins aws:SourceAccount -- that test needs a
        #                realistically shaped id, and inventing a 12-digit number that
        #                might belong to somebody would be worse than using the reserved one.
        run: |
          python - <<'PY'
          import pathlib
          import re

          ALLOWED_ACCOUNTS = {"763104351884",      # AWS public DLC registry
                              "111122223333"}      # AWS's reserved docs example account
          PATTERNS = {
              "aws access key": re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              "hugging face token": re.compile(r"\bhf_[A-Za-z0-9]{30,}\b"),
              "openai-style key": re.compile(r"\bsk-[A-Za-z0-9]{20,}\b"),
              "github token": re.compile(r"\bghp_[A-Za-z0-9]{36}\b"),
              "private key block": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "aws secret in config": re.compile(r"aws_secret_access_key\s*="),
          }
          ACCOUNT = re.compile(r"\b\d{12}\b")
          SKIP_DIRS = {".git", ".venv", "__pycache__", ".ruff_cache", ".pytest_cache"}

          problems = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or SKIP_DIRS & set(path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in PATTERNS.items():
                  if pattern.search(text):
                      problems.append(f"{path}: {label}")
              for found in set(ACCOUNT.findall(text)) - ALLOWED_ACCOUNTS:
                  problems.append(f"{path}: 12-digit AWS account id {found}")

          if problems:
              raise SystemExit("\n".join(sorted(set(problems))))
          print("no credentials or unexpected account ids found")
          PY
